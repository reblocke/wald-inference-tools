name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make fmt-check
      - run: make lint
      - run: make validate
      - run: make test
      - run: make build-site
      - run: git diff --check

  live-metadata:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make live-check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  browsers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps ${{ matrix.browser }}
      - run: make ${{ matrix.browser == 'chromium' && 'e2e' || 'e2e-webkit' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results*
          if-no-files-found: ignore
