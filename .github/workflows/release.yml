name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium webkit
      - run: make verify
      - run: make live-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify annotated tag and release metadata
        shell: bash
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          uv run python scripts/check_release_metadata.py --tag "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: uv run python scripts/build_release_artifacts.py --version "${GITHUB_REF_NAME#v}"
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
